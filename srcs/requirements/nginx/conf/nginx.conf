server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mgodawat.42.fr;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/mgodawat.crt;
    ssl_certificate_key /etc/nginx/ssl/mgodawat.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Root directory and index files
    root /var/www/html;
    index index.php index.html;

    # PERMANENT FIX: Stop NGINX from removing the :8443 port during redirects
    server_name_in_redirect off;
    port_in_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    # PHP-FPM Configuration
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass wordpress:9000;
        
        # Force these params so WordPress knows the external port is 8443
        fastcgi_param SERVER_NAME $host;
        fastcgi_param SERVER_PORT 8443;
        fastcgi_param HTTPS on;
    }
}
