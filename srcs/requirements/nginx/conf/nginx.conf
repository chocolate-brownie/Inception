server {
    # Listen only on port 443 for SSL
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name mgodawat.42.fr;

    # SSL Certificate paths
    ssl_certificate /etc/nginx/ssl/mgodawat.crt;
    ssl_certificate_key /etc/nginx/ssl/mgodawat.key;

    # Mandatory: Only TLS 1.2 and 1.3 are allowed
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pass PHP scripts to the WordPress container on port 9000
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass wordpress:9000;
    }
}
